########################################
# Identity Hub configuration (standalone)
########################################

# Base API (align with Dockerfile healthcheck at 8080)
web.http.port=8080
web.http.path=/api

# DID/STS/Credentials endpoints (optional if using single base API)
web.http.credentials.port=8281
web.http.credentials.path=/api/credentials
web.http.identity.port=8282
web.http.identity.path=/api/identity
web.http.did.port=8283
web.http.did.path=/
web.http.version.port=8285
web.http.version.path=/api/version
web.http.sts.port=8286
web.http.sts.path=/api/sts

# Identity keys
edc.ih.iam.publickey.path=/app/deployment/assets/public.pem
edc.ih.iam.privatekey.path=/app/deployment/assets/private.pem
edc.ih.iam.id=did:web:localhost%3A8281

# Superuser token for admin calls (sample)
edc.ih.api.superuser.key=c3VwZXItdXNlcg==.c3VwZXItc2VjcmV0LWtleQo=

# --- Persistence (PostgreSQL + Hashicorp Vault) ---
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

edc.datasource.default.url=jdbc:postgresql://postgres:5432/edc
edc.datasource.default.user=edc
edc.datasource.default.password=edc

# Auto-create SQL schema on startup (dev only)
edc.sql.schema.autocreate=true

# --- MVD integration: path to local credentials (VCs) ---
edc.mvd.credentials.path=/app/deployment/assets/credentials
