########################################
# Identity Hub configuration (standalone)
########################################

# Base API for health checks and general Identity Hub REST operations.
# docker-compose publishes this on host port 8380; keep aligned with the Dockerfile.
web.http.port=8080
web.http.path=/api

# Dedicated endpoints expose specific capabilities (credentials, DID resolution, STS tokens, etc.).
# Each one maps to a distinct port/path so you can wire external systems without sharing secrets.
web.http.credentials.port=8281
web.http.credentials.path=/api/credentials
web.http.identity.port=8282
web.http.identity.path=/api/identity
web.http.did.port=8283
web.http.did.path=/
web.http.version.port=8285
web.http.version.path=/api/version
web.http.sts.port=8286
web.http.sts.path=/api/sts

# Local filesystem paths to the DID keys baked into the container image.
# Update these if you mount different key material.
edc.ih.iam.publickey.path=/app/deployment/assets/public.pem
edc.ih.iam.privatekey.path=/app/deployment/assets/private.pem
edc.ih.iam.id=did:web:host.docker.internal%3A9483
edc.iam.did.web.use.https=false
edc.iam.sts.privatekey.alias=key-1
edc.iam.sts.publickey.id=did:web:provider-identityhub%3A7093#key-1

# Pre-generated superuser token allowing administrative API access during local development.
# Replace this if you expose the runtime beyond your machine.
edc.ih.api.superuser.key='c3VwZXItdXNlcg==.c3VwZXItc2VjcmV0LWtleQo='

# --- Persistence (PostgreSQL + Hashicorp Vault) ---
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

# JDBC datasource configuration shared with the other launchers.
edc.datasource.default.url=jdbc:postgresql://postgres:5432/edc
edc.datasource.default.user=edc
edc.datasource.default.password=edc

# Auto-create SQL schema on startup (development convenience; disable in hardened deployments).
edc.sql.schema.autocreate=true

# --- MVD integration: path to local credentials (VCs) ---
edc.mvd.credentials.path=/app/deployment/assets/credentials


