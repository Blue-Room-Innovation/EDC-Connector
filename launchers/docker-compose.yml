# Local connector stack: spins up control plane, data plane, identity hub plus supporting services.
name: edc-connector
services:
  controlplane:
    # Core runtime exposing management, protocol, catalog and health APIs.
    container_name: edc-controlplane
    build:
      context: ./controlplane
      dockerfile: src/main/docker/Dockerfile
      args:
        JAR: build/libs/controlplane.jar
    image: edc-controlplane:latest
    restart: unless-stopped
    ports:
      # Host:Container mappings keep the same 828x port range used by configuration.properties.
      - "9280:8280"
      - "9281:8281"
      - "9282:8282"
      - "9283:8283"
      - "9284:8284"
      - "9285:8285"
    volumes:
      # Mount local configuration/logging plus the participant directory shared with MVD scenarios.
      - ./controlplane/configuration.properties:/app/configuration.properties:ro
      - ./controlplane/logging.properties:/app/logging.properties:ro
      - ../deployment/assets/participants/participants.local.json:/etc/participants/participants.json:ro
    depends_on:
      # Start once backing services (database + vault) are ready.
      postgres:
        condition: service_healthy
      vault:
        condition: service_started

  dataplane:
    # Moves data between providers/consumers. Registers with the control plane via selector API.
    container_name: edc-dataplane
    build:
      context: ./dataplane
      dockerfile: src/main/docker/Dockerfile
      args:
        JAR: build/libs/dataplane.jar
    image: edc-dataplane:latest
    restart: unless-stopped
    depends_on:
      # Requires a healthy control plane (for selector) and database (for persistence).
      controlplane:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      # Expose REST API on 8081 (maps to container 8080) and the public transfer endpoint on 8290.
      - "9181:8080"
      - "9290:8290"
    volumes:
      # Provide runtime configuration/logging from the launcher directory.
      - ./dataplane/configuration.properties:/app/configuration.properties:ro
      - ./dataplane/logging.properties:/app/logging.properties:ro

  identity-hub:
    # Issues/verifies credentials and exposes STS/DID services required by the control plane.
    container_name: edc-identity-hub
    build:
      context: ./identity-hub
      dockerfile: src/main/docker/Dockerfile
      args:
        JAR: build/libs/identity-hub.jar
    image: edc-identity-hub:latest
    restart: unless-stopped
    environment:
      # Route filesystem-based config and logging settings into the shaded launcher.
      - ENV_JVM_ARGS=-Dedc.fs.config=/app/configuration.properties -Djava.util.logging.config.file=/app/logging.properties
    ports:
      # Publish the hub APIs on the 838x range to avoid clashing with the control plane.
      - "9480:8080"
      - "9481:8281"
      - "9482:8282"
      - "9483:8283"
      - "9485:8285"
      - "9486:8286"
    volumes:
      # Mount configuration, logging and the key/credential material required for DID operations.
      - ./identity-hub/configuration.properties:/app/configuration.properties:ro
      - ./identity-hub/logging.properties:/app/logging.properties:ro
      - ../deployment/assets/public.pem:/app/deployment/assets/public.pem:ro
      - ../deployment/assets/private.pem:/app/deployment/assets/private.pem:ro
      - ../deployment/assets/credentials:/app/deployment/assets/credentials:ro
    depends_on:
      # Needs Vault for secrets and PostgreSQL for persistence.
      vault:
        condition: service_started
      postgres:
        condition: service_healthy

  vault:
    # Dev-mode HashiCorp Vault storing secrets such as STS client credentials.
    container_name: edc-vault
    image: hashicorp/vault:1.15.2
    ports:
      - "9200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    command: "server -dev -dev-root-token-id=root"

  postgres:
    # Shared PostgreSQL database backing the control plane, dataplane and identity hub.
    container_name: edc-postgres
    image: postgres:15
    ports:
      - "9432:5432"
    environment:
      - POSTGRES_DB=edc
      - POSTGRES_USER=edc
      - POSTGRES_PASSWORD=edc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  # Persist database data between container restarts.
  pgdata:
