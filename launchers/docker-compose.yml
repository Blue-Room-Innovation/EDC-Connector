version: "3.8"
services:
  controlplane:
    container_name: edc-controlplane
    image: edc-controlplane
    build:
      context: ./controlplane/src/main/docker
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - vault
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edc
      - VAULT_ADDR=http://vault:8200
  dataplane:
    container_name: edc-dataplane
    image: edc-dataplane
    build:
      context: ./dataplane/src/main/docker
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - vault
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edc
      - VAULT_ADDR=http://vault:8200
  identity-hub:
    container_name: edc-identity-hub
    image: edc-identity-hub
    build:
      context: ./identity-hub/src/main/docker
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - vault
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/edc
      - VAULT_ADDR=http://vault:8200
  vault:
    container_name: edc-vault
    image: hashicorp/vault:1.15.2
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    command: "server -dev -dev-root-token-id=root"
  postgres:
    container_name: edc-postgres
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=edc
      - POSTGRES_USER=edc
      - POSTGRES_PASSWORD=edc
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
