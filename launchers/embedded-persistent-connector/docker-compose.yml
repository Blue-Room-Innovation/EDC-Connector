name: minimal-connector

services:
  connector-db:
    container_name: ${CONNECTOR_DB_CONTAINER_NAME:-connector-db}
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONNECTOR_DB_NAME:-minimal_connector}
      POSTGRES_USER: ${CONNECTOR_DB_USER:-connector}
      POSTGRES_PASSWORD: ${CONNECTOR_DB_PASSWORD:-connector}
    ports:
      - "${CONNECTOR_DB_PORT:-5532}:5432"
    volumes:
      - connector_db_data:/var/lib/postgresql/data

  connector:
    container_name: ${CONNECTOR_CONTAINER_NAME:-connector}
    build:
      context: ../..
      dockerfile: launchers/embedded-persistent-connector/src/main/docker/Dockerfile
      args:
        JAR: minimal-connector.jar
    image: ${CONNECTOR_IMAGE:-minimal-connector:latest}
    restart: unless-stopped
    depends_on:
      - connector-db
    extra_hosts:
      - "${PROVIDER_CONTROLPLANE_HOST:-provider-controlplane}:${PROVIDER_CONTROLPLANE_GATEWAY:-host-gateway}"
    volumes:
      - "${CONNECTOR_CONFIGURATION_FILE:-./configuration.properties}:/app/configuration.properties:ro"
      - "${CONNECTOR_LOGGING_FILE:-./logging.properties}:/app/logging.properties:ro"
      - "${CONNECTOR_LOGS_DIR:-./logs}:/app/logs"
    environment:
      EDC_HOSTNAME: "${CONNECTOR_HOSTNAME:-connector}"
      EDC_PARTICIPANT_ID: "${CONNECTOR_PARTICIPANT_ID:-did:web:provider-identityhub%3A7093}"
      EDC_IAM_ISSUER_ID: "${CONNECTOR_ISSUER_ID:-did:web:provider-identityhub%3A7093}"
      EDC_IAM_DID_WEB_USE_HTTPS: "${CONNECTOR_DID_WEB_USE_HTTPS:-false}"
      EDC_API_AUTH_KEY: "${CONNECTOR_API_AUTH_KEY:-edc-dev}"
      EDC_DSP_CALLBACK_ADDRESS: "${CONNECTOR_DSP_CALLBACK_ADDRESS:-http://connector:8282/api/dsp}"
      EDC_DATASOURCE_DEFAULT_URL: "jdbc:postgresql://${CONNECTOR_DB_HOST:-connector-db}:5432/${CONNECTOR_DB_NAME:-minimal_connector}"
      EDC_DATASOURCE_DEFAULT_USER: "${CONNECTOR_DB_USER:-connector}"
      EDC_DATASOURCE_DEFAULT_PASSWORD: "${CONNECTOR_DB_PASSWORD:-connector}"
      EDC_SQL_SCHEMA_AUTOCREATE: "${CONNECTOR_SQL_AUTOCREATE:-true}"
      EDC_VAULT_HASHICORP_URL: "${CONNECTOR_VAULT_URL:-http://provider-vault:8200}"
      EDC_VAULT_HASHICORP_TOKEN: "${CONNECTOR_VAULT_TOKEN:-root}"
      EDC_IAM_STS_OAUTH_TOKEN_URL: "${CONNECTOR_STS_TOKEN_URL:-http://host.docker.internal:8582/api/sts/token}"
      EDC_IAM_STS_OAUTH_CLIENT_ID: "${CONNECTOR_STS_CLIENT_ID:-did:web:provider-identityhub%3A7093}"
      EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS: "${CONNECTOR_STS_CLIENT_SECRET_ALIAS:-did:web:provider-identityhub%3A7093-sts-client-secret}"
      EDC_IAM_STS_PRIVATEKEY_ALIAS: "${CONNECTOR_STS_PRIVATE_KEY_ALIAS:-did:web:provider-identityhub%3A7093#key-1}"
      EDC_IAM_STS_PUBLICKEY_ID: "${CONNECTOR_STS_PUBLIC_KEY_ID:-did:web:provider-identityhub%3A7093#key-1}"
      EDC_IAM_DSP_SCOPE_DEFAULT: "${CONNECTOR_DSP_SCOPE:-org.eclipse.edc.vc.type:MembershipCredential:read}"
      WEB_HTTP_DEFAULT_PORT: "8181"
      WEB_HTTP_DEFAULT_PATH: "/api"
      WEB_HTTP_MANAGEMENT_PORT: "8281"
      WEB_HTTP_PROTOCOL_PORT: "8282"
      WEB_HTTP_CONTROL_PORT: "8283"
      WEB_HTTP_CATALOG_PORT: "8284"
      WEB_HTTP_MANAGEMENT_PATH: /api/management
      WEB_HTTP_PROTOCOL_PATH: /api/dsp
      WEB_HTTP_CONTROL_PATH: /api/control
      WEB_HTTP_CATALOG_PATH: /api/catalog
      WEB_HTTP_MANAGEMENT_AUTH_TYPE: tokenbased
      WEB_HTTP_MANAGEMENT_AUTH_KEY: "${CONNECTOR_MANAGEMENT_AUTH_KEY:-edc-dev}"
      WEB_HTTP_CATALOG_AUTH_TYPE: tokenbased
      WEB_HTTP_CATALOG_AUTH_KEY: "${CONNECTOR_CATALOG_AUTH_KEY:-edc-dev}"
    ports:
      - "${CONNECTOR_HTTP_PORT:-8181}:8181" # HTTP default / health
      - "${CONNECTOR_MANAGEMENT_PORT:-9081}:8281" # Management API
      - "${CONNECTOR_PROTOCOL_PORT:-9082}:8282" # DSP protocol
      - "${CONNECTOR_CONTROL_PORT:-9083}:8283" # Control API
      - "${CONNECTOR_CATALOG_PORT:-9084}:8284" # Catalog API
    networks:
      - default
      - edc-scenario
    # Para limpiar contenedores huérfanos de versiones previas: `docker compose down --remove-orphans`

volumes:
  connector_db_data:

networks:
  edc-scenario:
    external: true
    name: ${CONNECTOR_EXTERNAL_NETWORK:-edc-scenario-main_default}
