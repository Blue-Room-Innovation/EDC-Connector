# Identidad básica (valores placeholder, sobrescribe vía variables si apuntas a otro DID)
edc.participant.id=did:web:connector%3A8282
edc.hostname=localhost
edc.monitor.level=INFO

# HTTP contexts (los puertos pueden sobrescribirse vía variables de entorno)
web.http.default.port=8181
web.http.default.path=/api

web.http.management.port=8281
web.http.management.path=/api/management
web.http.management.auth.type=tokenbased
web.http.management.auth.key=edc-dev

web.http.protocol.port=8282
web.http.protocol.path=/api/dsp

web.http.control.port=8283
web.http.control.path=/api/control

web.http.catalog.port=8284
web.http.catalog.path=/api/catalog
web.http.catalog.auth.type=tokenbased
web.http.catalog.auth.key=edc-dev

web.http.version.port=0
web.http.version.path=/api/version

edc.api.auth.key=edc-dev

# DSP callback y selector Data Plane (por defecto en local). En Docker se sobrescribe el callback vía env.
edc.dsp.callback.address=http://localhost:8282/api/dsp
edc.dataplane.selector.url=http://localhost:8283/api/control/v1/dataplanes
edc.dataplane.transfer.proxy.token.verifier.publickey.alias=did:web:connector%3A8282#key-1
edc.dataplane.transfer.proxy.token.signer.privatekey.alias=did:web:connector%3A8282#key-1

# Persistencia SQL (Postgres local). En Docker se apunta al servicio connector-db.
edc.datasource.default.url=jdbc:postgresql://localhost:5532/minimal_connector
edc.datasource.default.user=connector
edc.datasource.default.password=connector
edc.sql.schema.autocreate=true

# Vault y STS (placeholders compatibles con el escenario i2cat cuando está publicado en el host)
edc.vault.hashicorp.url=http://host.docker.internal:8400
edc.vault.hashicorp.token=root

edc.iam.did.web.use.https=false
edc.iam.issuer.id=did:web:connector%3A8282
edc.iam.sts.oauth.token.url=http://host.docker.internal:8582/api/sts/token
edc.iam.sts.oauth.client.id=did:web:connector%3A8282
edc.iam.sts.oauth.client.secret.alias=did:web:connector%3A8282-sts-client-secret
edc.iam.sts.oauth.privatekey.alias=did:web:connector%3A8282#key-1
edc.iam.sts.publickey.id=did:web:connector%3A8282#key-1
edc.iam.dsp.scope.default=org.eclipse.edc.vc.type:MembershipCredential:read

# CORS: habilitado para facilitar pruebas desde herramientas web
edc.web.rest.cors.enabled=true
edc.web.rest.cors.origins=*
edc.web.rest.cors.headers=x-api-key, content-type, authorization
edc.web.rest.cors.methods=GET,POST,DELETE,PUT,OPTIONS
