########################################
# Control Plane configuration (standalone)
########################################

# Default API (health + base REST surface exposed on host port 8280).
# Keep this aligned with docker-compose and the Dockerfile health check.
web.http.port=8280
web.http.path=/api

# Management API (used by admins/automation to create assets, policies, etc.).
# Token-based auth protects all calls; key is "password" for local setups.
web.http.management.port=8281
web.http.management.path=/api/management
web.http.management.auth.type=tokenbased
web.http.management.auth.key=password

# Control API (dataplane selector interactions). Runtime appends /v1 for versioned endpoints.
web.http.control.port=8283
web.http.control.path=/api/control

# DSP Protocol API (exposed to other participants for protocol negotiations).
web.http.protocol.port=8282
web.http.protocol.path=/api/dsp

# Catalog + Version APIs (used by catalog queries and health/metadata calls).
web.http.catalog.port=8284
web.http.catalog.path=/api/catalog
web.http.catalog_auth.type=tokenbased
web.http.catalog_auth.key=password

# Version endpoint mirrors MVD defaults and is often scraped by tooling.
web.http.version.port=8285
web.http.version.path=/api/version

# Connector's DID plus the callback address other parties use for protocol callbacks.
edc.participant.id=did:web:localhost%3A8281
edc.dsp.callback.address=http://host.docker.internal:8282/api/dsp

# EDC API authentication (global)

# Enable management context
edc.management.context.enabled=true

# MVD participants list (mounted at /etc/participants/participants.json)
edc.mvd.participants.list.file=/etc/participants/participants.json

# --- Persistence (PostgreSQL + Hashicorp Vault) ---
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

edc.datasource.default.url=jdbc:postgresql://postgres:5432/edc
edc.datasource.default.user=edc
edc.datasource.default.password=edc

# Auto-create SQL schema on startup (development convenience; disable for production).
edc.sql.schema.autocreate=true

# --- Identity & STS (required for token exchanges with the Identity Hub) ---
edc.iam.issuer.id=did:web:localhost%3A8281
edc.iam.sts.oauth.token.url=http://identity-hub:8286/api/sts/token
edc.iam.sts.oauth.client.id=did:web:localhost%3A8281
edc.iam.sts.oauth.client.secret.alias=did:web:localhost%3A8281-sts-client-secret
edc.iam.did.web.use.https=false

# CORS (align with MVD)
edc.web.rest.cors.enabled=true
edc.web.rest.cors.origins=*
edc.web.rest.cors.headers=x-api-key, content-type
edc.web.rest.cors.methods=GET, POST, DELETE, PUT, OPTIONS
