########################################
# Dataplane configuration (standalone)
########################################

# Default REST API used for health and internal control messages.
# Container listens on 8080; docker-compose maps it to host port 8081.
web.http.port=8080
web.http.path=/api

# Public dataplane API consumed by transfer proxies when moving data.
web.http.public.port=8290
web.http.public.path=/api/public

# Token material shared with the control plane for authenticating proxy calls.
# Update these aliases if you replace the sample DID keys.
edc.transfer.proxy.token.verifier.publickey.alias=key-1
edc.transfer.proxy.token.signer.privatekey.alias=key-1

# Control plane registration endpoint (the runtime appends /v1 when calling it).
# Hostname "controlplane" resolves via the Docker Compose service name.
edc.dpf.selector.url=http://controlplane:8283/api/control/v1/dataplanes

# --- Persistence (PostgreSQL + optional Vault) ---
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

# JDBC connection settings for the shared PostgreSQL instance.
edc.datasource.default.url=jdbc:postgresql://postgres:5432/edc
edc.datasource.default.user=edc
edc.datasource.default.password=edc

# Auto-create SQL schema on startup (handy for dev/testing; disable for managed environments).
edc.sql.schema.autocreate=true

