########################################
# Dataplane configuration (standalone)
########################################

# Default API (health at /api/check/health)
web.http.port=8080
web.http.path=/api

# Public dataplane API (for data transfer proxy)
web.http.public.port=8290
web.http.public.path=/api/public

# Token settings (adjust to your keys if needed)
edc.transfer.proxy.token.verifier.publickey.alias=did:web:localhost%3A8281#key-1
edc.transfer.proxy.token.signer.privatekey.alias=did:web:localhost%3A8281-alias

# Register with the control plane's dataplane selector (control path base + /v1 added by API)
edc.dpf.selector.url=http://controlplane:8283/api/control/v1/dataplanes

# --- Persistence (PostgreSQL + optional Vault) ---
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root

edc.datasource.default.url=jdbc:postgresql://postgres:5432/edc
edc.datasource.default.user=edc
edc.datasource.default.password=edc

# Auto-create SQL schema on startup (dev only)
edc.sql.schema.autocreate=true

