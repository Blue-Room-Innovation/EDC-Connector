[bundles]
jackson = ["jackson.annotations", "jackson.databind"]
jersey-core = ["jersey.server", "jersey.common", "jersey.jackson", "jersey.multipart", "jersey.inject", "jersey.servlet", "jersey.servletcore"]
jupiter = ["junit-jupiter-api", "junit-jupiter-params"]
connector = [
    "edc-boot",
    "edc-core-connector",
    "edc-core-runtime",
    "edc-core-api",
    "edc-ext-http",
    "edc-api-observability",
    "edc-ext-jsonld",
    "edc-core-token",
    "edc-config-fs",
]

dcp = [
    "edc-dcp",
    "edc-did-core",
    "edc-did-web",
    "edc-oauth2-client",
    "edc-dcp-core",
]

sql-edc = [
    "edc-sql-assetindex",
    "edc-sql-contractdef",
    "edc-sql-contractneg",
    "edc-sql-policydef",
    "edc-sql-edrcache",
    "edc-sql-transferprocess",
    "edc-sql-dataplane-instancestore",
    "edc-sql-core",
    "edc-sql-lease",
    "edc-sql-pool",
    "edc-sql-transactionlocal",
    "postgres",
]

[plugins]
shadow = { id = "com.gradleup.shadow", version = "8.3.6" }
